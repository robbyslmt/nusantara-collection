al Java performance scene, Pexels"},{name:"Cut Nanda Oemar",note:"outdoor performance, Pexels"},{name:"kevin yung",note:"Surakarta workshop series, Pexels"},{name:"rakhmat suwandi",note:"artisan at work series, Pexels"},{name:"Andoll",note:"detailed puppet close-up, Pexels"}],Rr={id:37700979,alt:"Wayang kulit puppet performance in nature"},Sy=[{term:"kelir",gloss:"the cotton screen; the boundary between two worlds"},{term:"blencong",gloss:"the oil lamp that throws the shadow"},{term:"dalang",gloss:"the puppeteer; narrator, voice actor, conductor, priest, philosopher"},{term:"debog",gloss:"the banana-log stage where puppets are planted"},{term:"gunungan",gloss:"the tree-of-life figure that opens and closes scenes"},{term:"alus",gloss:"refined; used for noble, gentle characters"},{term:"gagah",gloss:"bold, coarse; used for strong, rough characters"},{term:"punakawan",gloss:"the clown companions: Semar, Gareng, Petruk, Bagong"},{term:"pesinden",gloss:"female singer who accompanies the gamelan"},{term:"cempurit",gloss:"the control rod that holds the puppet"}],xy=[{name:"Arjuna",type:"alus",role:"refined hero of the Mahabharata",desc:"Narrow eyes, slender build, downcast gaze. He carries the bow and speaks in measured verse. Every court dalang knows how Arjuna holds his silence."},{name:"Bima",type:"gagah",role:"blunt strong Pandawa",desc:"Broad shoulders, bulging eyes, direct speech. He is the Pandawa who acts before he thinks, whose club (Gada) is both weapon and promise."},{name:"Gatotkaca",type:"gagah",role:"flying knight, son of Bima",desc:"Huge wings made of painted leather, a helmet with antennae. He flies into battle with a roar. His shadow is the largest on the screen."},{name:"Semar",type:"punakawan",role:"the clown-sage, divine in disguise",desc:"Short, round-faced, the lowest in rank yet the oldest soul in the story. He is a god who chose poverty to stay close to humanity. His jokes carry the weight of scripture."},{name:"Gareng",type:"punakawan",role:"Semar's son, the hunchbacked philosopher",desc:"Crooked back, one shoulder lower than the other. He is the punakawan who thinks most and speaks least, whose questions cut through noble lies."},{name:"Petruk",type:"punakawan",role:"the tall clown with long limbs",desc:"Lanky, awkward, possessed of a heart larger than his body. He is the punakawan of impossible love and impossible loyalty."},{name:"Bagong",type:"punakawan",role:"the gluttonous, comic younger clown",desc:"Round belly, hungry eyes, always on the edge of a pratfall. He represents appetite and appetite alone, yet even he knows when to be still."}],Ty=[{step:"The hide",gloss:"buffalo hide is prepared",text:"Wayang kulit starts with buffalo hide, cured for weeks until it is thin enough to let light pass but thick enough to hold fine carving. The hide is stretched, scraped, and dried until it is almost translucent."},{step:"The carving",gloss:"the figure is cut with a fine knife",text:"The dalang draws the outline on the hide, then carves with a small knife called a tatapan. The cuts are not just lines: they are textures. Eyes, mouths, crowns, and patterns are all reduced to open and closed space. The finer the cut, the richer the shadow."},{step:"The painting",gloss:"gold leaf and color are applied",text:"After carving, the puppet is mounted on a buffalo-hide frame and painted. Gold leaf (prada) is applied to the ornaments. Red, black, and gold are the oldest colors. Modern puppets use acrylic, but old-school purists insist on natural pigments."},{step:"The articulation",gloss:"joints and control rods are fitted",text:"The cempurit (central control rod) holds the puppet from above. Arm rods are thin bamboo sticks attached to the hands. When the dalang moves the rod, the arm follows with a delay that looks like breathing. The puppet is not controlled; it is guided."}],zy=[{eyebrow:"Prologue",title:"The screen, the lamp, the night",lead:"Wayang kulit is performed in the dark. Not total darkness: a single oil lamp called a blencong sits behind the cotton screen, and its flame is the only light the audience sees. The puppet is never seen clearly. What matters is what the flame makes of it."},{eyebrow:"Chapter one",title:"What wayang kulit is",lead:"Flat leather shadow puppets, carved from buffalo hide, performed from dusk until dawn. Stories from the Ramayana and Mahabharata, reshaped into Javanese telling. The puppet is ornate; its shadow is stylized. The difference between them is the whole art."},{eyebrow:"Chapter two",title:"The dalang",lead:"The puppeteer is narrator, voice actor, conductor, priest and philosopher in one person. He trains for years. He directs the gamelan with hand signals called kepyak. He speaks for every character, changes his voice, his posture, his breath. When the dalang is absent, the show is suspended."},{eyebrow:"Chapter three",title:"The screen and the lamp",lead:"The kelir is a white cotton screen stretched on a wooden frame. The blencong is an oil lamp, historically fueled by coconut oil, now often kerosene or a halogen substitute. The puppets stand on a banana-log stage called debog. There are two audiences: the shadow side sees the essence; the dalang side sees the ornamented leather."},{eyebrow:"Chapter four",title:"The puppets",lead:"Carved then painted, gold leaf called prada applied to the ornaments. The gap between the leather figure and its shadow is intentional: the shadow is stylized, the puppet ornate. The cempurit is the central control rod; arm rods are thin bamboo sticks that give the hands a delayed, breathing motion."},{eyebrow:"Chapter five",title:"Character language",lead:"Refined (alus) characters have narrow eyes, slender build, downcast gaze. Coarse (gagah or kasar) characters have bulging eyes, broad shoulders. Arjuna is the refined hero; Bima is blunt strength; Gatotkaca is the flying knight; Semar is the clown-sage who is divine in disguise; the Punakawan clowns carry philosophy and social commentary."},{eyebrow:"Chapter six",title:"The gunungan",lead:"The tree-of-life figure that opens and closes scenes, marks the start and end of the story. Its shape is a stylized mountain with a tree at its center. The gunungan appears at the beginning, frames each episode, and returns at the end. It is both punctuation and promise."},{eyebrow:"Chapter seven",title:"Music",lead:"The gamelan accompanies, the pesinden (female singers) and gerong (male chorus) sing; the dalang cues everything with hand signals. The music is not background. It is a conversation between instruments and voices that the dalang shapes in real time."},{eyebrow:"Chapter eight",title:"UNESCO",lead:"Wayang kulit was proclaimed a Masterpiece of the Oral and Intangible Heritage of Humanity in 2003, one of the first Indonesian inscriptions. The recognition did not change the art; it gave the dalang a microphone louder than the blencong."},{eyebrow:"Chapter nine",title:"Wayang today",lead:"Still performed at weddings, village celebrations called bersih desa, national holidays. Modern dalangs mix humor and current issues into the old stories. Wayang is moral education, community memory, and nightly entertainment, all at once."},{eyebrow:"Words to carry home",title:"Six words, and what they hold",lead:"Say them and the craft opens a little."}],Cr=[{k:"Dusk to dawn",v:"A traditional wayang performance lasts from roughly 9 p.m. until sunrise. The audience brings mats, food, and patience. The dalang must know the story so well that he can improvise for hours."},{k:"One figure, weeks of work",v:"A single wayang puppet can take two to four weeks to carve, paint, and assemble. The finest dalangs make their own puppets; others commission specialized artisans."},{k:"The shadow is stylized",v:"The puppet is painted and ornamented; its shadow is a simplified silhouette. The dalang exploits this: a character's shadow can look different from the figure that casts it, adding a layer of meaning."},{k:"The gamelan plays the mood",v:"The dalang cues the gamelan with the kepyak (a wooden plate struck with a mallet). Sad scenes use slower pathet; battle scenes use bright, loud instruments. The music does not follow the story; it leads it."},{k:"2003 inscription",v:"UNESCO inscribed wayang kulit on the Representative List of the Intangible Cultural Heritage of Humanity on 7 November 2003. Indonesia celebrates this as a turning point in the recognition of its shadow traditions."},{k:"Still alive",v:"Wayang kulit is performed in villages across Java, Bali, and Lombok every week. New dalangs are trained in traditional schools called sanggar. The art survives because it is owned by the community, not by a museum."}];function Ey(){const[_,q]=Nl.useState(()=>typeof window>"u"?"dark":window.localStorage.getItem("kelir-theme")==="light"?"light":"dark");return Nl.useEffect(()=>{document.documentElement.setAttribute("data-theme",_),window.localStorage.setItem("kelir-theme",_)},[_]),{theme:_,toggle:()=>q(g=>g==="dark"?"light":"dark")}}function bl({children:_,delay:q=0}){const g=Nl.useRef(null);return Nl.useEffect(()=>{const f=g.current;if(!f)return;const A=new IntersectionObserver(Z=>{Z.forEach(al=>{al.isIntersecting&&(f.classList.add("is-in"),A.unobserve(f))})},{threshold:.12});return A.observe(f),()=>A.disconnect()},[]),r.jsx("div",{ref:g,className:"reveal",style:{transitionDelay:`${q}ms`},children:_})}function Ae({eyebrow:_,title:q,lead:g}){return r.jsxs("div",{className:"mb-10 max-w-3xl",children:[r.jsx("p",{className:"mb-3 text-xs uppercase tracking-[0.28em]",style:{color:"var(--accent)",fontFamily:"var(--font-mono)"},children:_}),r.jsx("h2",{className:"font-display text-3xl leading-tight sm:text-4xl md:text-5xl",style:{color:"var(--ink)"},children:q}),g&&r.jsx("p",{className:"mt-5 text-lg leading-relaxed",style:{color:"var(--ink-soft)"},children:g}),r.jsx("div",{className:"screen-rule mt-8 w-24"})]})}function _u({char:_,className:q}){return r.jsx("span",{"aria-hidden":!0,className:`ghost-glyph absolute ${q??""}`,c
