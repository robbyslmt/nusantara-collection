laced by hand. Representative imagery.",credit:"Hera Permata S"},{id:36944259,alt:"Elderly woman crafting traditional batik art",caption:"Sixty years of muscle memory. Representative imagery.",credit:"Jauhar Musthofal Qulub"},{id:37430449,alt:"Traditional batik making in Indonesia",caption:"The wajan, the small iron pan that holds the wax. Representative imagery.",credit:"Syam Arif"},{id:35270659,alt:"Traditional batik market scene in Bandung",caption:"Batik by the bolt at market. Representative imagery.",credit:"Andry Sasongko"},{id:32232883,alt:"Elegant Indonesian woman wearing traditional batik clothing",caption:"Worn, not displayed: batik as daily language. Representative imagery.",credit:"Noval Gani"},{id:37883230,alt:"Young Indonesian girl creating a batik art piece",caption:"The next generation learns the line early. Representative imagery.",credit:"ubed"},{id:28855659,alt:"Artisan creating a traditional batik fabric design",caption:"Pattern planning before the wax touches cloth. Representative imagery.",credit:"Jeffry Surianto"},{id:35243199,alt:"Artisan creating traditional batik in West Java",caption:"West Java's workshops keep the tulis tradition. Representative imagery.",credit:"Ruyat Supriazi"}],yy=[{term:"malam",gloss:"the wax; the heart of the craft"},{term:"canting",gloss:"the copper pen that carries the wax"},{term:"mori",gloss:"the prepared cotton cloth"},{term:"wajan",gloss:"the small pan that melts the wax"},{term:"isen-isen",gloss:"the fine filler patterns inside outlines"},{term:"nglorod",gloss:"boiling the wax away to reveal the cloth"}],vy=[{name:"Parang",region:"Yogyakarta & Surakarta",story:"Diagonal blades in a row, unbroken like a wave. Once a court pattern: the 17th-century Mataram rulers reserved parang for the royal family, and commoners were forbidden to wear it. The larger the blade, the higher the rank."},{name:"Kawung",region:"Central Java courts",story:"Four circles arranged around a center, said to depict the fruit of the aren palm, or the lotus. Read as purity and self-control: a person who remembers the center no matter which direction they face."},{name:"Mega Mendung",region:"Cirebon, north coast",story:"Layered clouds in graded blue, borrowed from Chinese cloud imagery and made Cirebon's own. The gradient is the point: patience, like weather forming, anger held in layers until it passes."},{name:"Truntum",region:"Surakarta",story:"Small scattered stars, said to be drawn by a queen waiting for her husband's love to bloom again. Worn by the parents of a bride and groom: love that re-grows, and guides the couple."},{name:"Sido Mukti",region:"Central Java",story:"Sido means 'become', mukti means 'prosperity'. One of the wedding cloths: worn so that the marriage becomes prosperous. A whole family of sido patterns exists, each wishing something different."},{name:"Sekar Jagad",region:"Yogyakarta & Surakarta",story:"A map of many motifs in one cloth, islands of pattern separated by bare cloth. The name is folk-read as 'flower of the world': the whole world drawn on a single body."}],gy=[{step:"Nglowong",gloss:"drawing the first wax lines",text:"The design is drawn in hot wax onto the mori cloth, on both sides. The canting is held like a pen, tipped and blown through to keep the wax flowing. A confident line cannot be redrawn: the wax remembers every hesitation."},{step:"Nembok",gloss:"blocking the areas to keep white",text:"Large areas that must stay the color of the cloth are covered in a thick layer of wax. This is armor, not drawing: the dye bath cannot touch what the wax has claimed."},{step:"Medel / dyeing",gloss:"the cloth enters the dye bath",text:"The cloth is dipped, again and again, into indigo or soga. Each dip deepens the color. Old workshops kept their indigo vats alive for years, fed and stirred like a living thing."},{step:"Nglorod",gloss:"boiling the wax away",text:"The cloth goes into boiling water. The wax melts off and floats to the surface, and the pattern appears for the first time as cloth: everything the wax touched stayed light, everything it left took the dye. The wax is skimmed, saved, and used again."}],by=[{name:"Yogyakarta & Surakarta",label:"the courts",text:"The classical heartland. Soga brown and indigo blue on cream cloth, patterns governed by court rule. Here batik was law as much as craft: which motif, which size, who may wear it."},{name:"Pekalongan",label:"the north coast",text:"The port city where batik met the world. Chinese merchants brought red and cloud motifs, Arab traders brought green and calligraphic geometry, Dutch residents ordered floral tablecloths. Pekalongan answered all of them in color, and became the busiest batik city on Java."},{name:"Cirebon",label:"the cloud city",text:"Home of mega mendung, the layered cloud, and of court patterns that mix Javanese and Chinese lineage. Cirebon batik is drawn with a confident, slightly wild line."},{name:"Lasem",label:"the red coast",text:"A small port east of Cirebon where Chinese-Javanese families made batik in deep blood-red, the color called abang getih pitik: chicken-blood red. Lasem cloth traveled to Singapore and beyond on batik ships."}],Sy=[{k:"2 October 2009",v:"UNESCO inscribed Indonesian batik on the Representative List of the Intangible Cultural Heritage of Humanity. The date is now Hari Batik Nasional, and the country wears it."},{k:"One cloth, weeks of work",v:"A fine batik tulis can take two weeks to three months of daily waxing and dyeing. The most complex court cloths take longer still."},{k:"The wax is reused",v:"After nglorod, the melted wax is skimmed from the boiling water, cleaned, and melted again. In old workshops the same wax has carried thousands of patterns."},{k:"Friday is batik day",v:"Across Indonesia, offices and schools wear batik on Fridays. Weddings, graduations, and state dinners have their own prescribed patterns."}],py=[{name:"batik mahoni",note:"hero film and workshop film, Pexels"},{name:"John Bastian",note:"Pexels"},{name:
