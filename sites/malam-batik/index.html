.rn-wrap { margin-top: 4rem; }
.rn-rule { height: 1px; background: var(--line); }
.rn-row {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: stretch;
  gap: 1rem;
  padding-top: 1.5rem;
}
.rn-link {
  display: flex;
  flex-direction: column;
  gap: 0.35rem;
  text-decoration: none;
  padding: 0.9rem 1rem;
  border-radius: 10px;
  transition: background 0.25s ease, transform 0.25s ease;
}
.rn-link:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); transform: translateY(-2px); }
.rn-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.rn-next { text-align: right; align-items: flex-end; }
.rn-dir {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted);
}
.rn-name {
  font-size: 15px;
  font-weight: 600;
  color: var(--ink);
}
.rn-name em { font-style: normal; font-weight: 400; color: var(--ink-soft); }
.rn-home {
  align-self: center;
  justify-self: center;
  white-space: nowrap;
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted);
  text-decoration: none;
  border: 1px solid var(--line);
  border-radius: 9999px;
  padding: 0.55rem 1.1rem;
  transition: color 0.25s ease, border-color 0.25s ease;
}
.rn-home:hover { color: var(--accent); border-color: var(--accent); }
.rn-home:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (max-width: 640px) {
  .rn-row { grid-template-columns: 1fr; }
  .rn-next { text-align: left; align-items: flex-start; }
  .rn-home { order: -1; justify-self: start; }
}
@media (prefers-reduced-motion: reduce) {
  .rn-link, .rn-home { transition: none; }
  .rn-link:hover { transform: none; }
}

tional batik",caption:"The workshop keeps its own hours. Representative imagery.",credit:"JENNI AGUSTINA"},{id:36977424,alt:"Javanese woman creating traditional batik art",caption:"Wax, breath, and a steady wrist. Representative imagery.",credit:"motomoto sc"},{id:35189098,alt:"Traditional batik making in West Java, Indonesia",caption:"Cloth on the frame, wax in the wajan. Representative imagery.",credit:"Ruyat Supriazi"},{id:10682943,alt:"Close-up of a hand decorating fabric with wax",caption:"The line is drawn once and cannot be hesitated. Representative imagery.",credit:"John Bastian"},{id:34161634,alt:"Traditional batik making process in Jakarta",caption:"Batik survives in city workshops too. Representative imagery.",credit:"Daniel Lee"},{id:37686892,alt:"Indonesian woman crafting traditional batik",caption:"Each dot placed by hand. Representative imagery.",credit:"Hera Permata S"},{id:36944259,alt:"Elderly woman crafting traditional batik art",caption:"Sixty years of muscle memory. Representative imagery.",credit:"Jauhar Musthofal Qulub"},{id:37430449,alt:"Traditional batik making in Indonesia",caption:"The wajan, the small iron pan that holds the wax. Representative imagery.",credit:"Syam Arif"},{id:35270659,alt:"Traditional batik market scene in Bandung",caption:"Batik by the bolt at market. Representative imagery.",credit:"Andry Sasongko"},{id:32232883,alt:"Elegant Indonesian woman wearing traditional batik clothing",caption:"Worn, not displayed: batik as daily language. Representative imagery.",credit:"Noval Gani"},{id:37883230,alt:"Young Indonesian girl creating a batik art piece",caption:"The next generation learns the line early. Representative imagery.",credit:"ubed"},{id:28855659,alt:"Artisan creating a traditional batik fabric design",caption:"Pattern planning before the wax touches cloth. Representative imagery.",credit:"Jeffry Surianto"},{id:35243199,alt:"Artisan creating traditional batik in West Java",caption:"West Java's workshops keep the tulis
