E.jsx("button",{onMouseDown:pl,onMouseUp:Ql,onMouseLeave:Ql,onTouchStart:pl,onTouchEnd:Ql,"aria-label":"Hold to heat the wok",className:"rounded-full bg-[var(--accent)] px-8 py-3 font-mono text-sm uppercase tracking-widest text-[var(--bg)] transition-colors hover:bg-[var(--accent-soft)] active:scale-95",children:A?"Heating...":"Hold the fire"}),E.jsx("button",{onClick:Zl,"aria-label":"Stir the wok to prevent burning",className:"rounded-full border border-[var(--line)] bg-[var(--bg-2)] px-8 py-3 font-mono text-sm uppercase tracking-widest text-[var(--ink)] transition-colors hover:bg-[var(--accent)] hover:text-[var(--bg)]",children:"Stir"})]}),el&&E.jsx("p",{className:"text-sm text-[var(--accent)]",children:"Stir now or the paste will burn."})]})]})}const o0=[{id:"hero",title:"MARANDANG",subtitle:"The verb is the dish.",body:"The Minangkabau word marandang means to cook coconut milk and spices down slowly over hours until the liquid is gone and the meat is preserved in its own spiced oil. It is a verb before it is a noun. It describes a process, not a plate. Every rendang begins as a liquid, a golden slurry of coconut and chilli and galangal. Every rendang ends as something dark, dry, and concentrated beyond recognition. The fire is not optional. The patience is not optional."},{id:"what-it-is",title:"What rendang is",body:"Rendang is beef slow-cooked in coconut milk and a ground spice paste until the liquid evaporates and the meat fries in the spiced coconut oil. The result is dark brown, dry, intensely concentrated. The meat is not merely cooked: it is transformed. The fibres collapse into themselves, absorbing the spice paste until every strand carries the flavour of the reduction. It is a preservation technology disguised as a dish. The fat content of the coconut milk, once the water has boiled away, becomes a preservative. A properly dry rendang kept without refrigeration can last for weeks. This is why it was carried on long journeys. This is why it was made for weddings that lasted three days. This is why it is still the centrepiece of the Minangkabau table."},{id:"three-stages",title:"Three stages: gulai, kalio, rendang",body:"Rendang is the end point, not the starting point. The reduction passes through three named stages. Gulai is the liquid curry stage, pale coconut-cream and floating spice, eaten after the first hour of cooking. Kalio is the thickened stage, golden-brown, still moist, oily, what many restaurants outside Sumatra actually serve. Rendang is the fully reduced stage, dark, dry, the oil separated and the meat glistening with spice. Most people know only the last name. The first two are invisible to the tourist menu but they are where the chemistry happens."},{id:"spice-paste",title:"The spice paste: pemasak",body:"The spice paste is called pemasak or pampih. It is ground by hand on a stone slab, usually a combination of chilli, galangal, lemongrass, garlic, shallot, ginger, turmeric, candlenut, and sometimes toasted coconut, kelapa gongseng or sarundeng, for the dark colour. The completeness of the pemasak is the point. Each ingredient is a note in the chord. Remove one and the reduction sounds different. The paste is fried in the coconut milk before the meat goes in, blooming the spices in fat so their aromatics release in oil, not water. This is why the dish is cooked down and not simmered in broth. It is an oil-based reduction from the first minute."},{id:"origins",title:"Minangkabau origins",body:"Rendang comes from the Minang highlands of West Sumatra, the high plateau country where the rivers cut deep and the monsoons arrive late. The Minangkabau are the largest matrilineal society on earth, a people of clan houses with roof horns that curve upward like buffalo horns, a people whose young men leave home for years in the tradition of merantau, leaving home to seek fortune, returning only when they have found it. Rendang was their preservation food. A properly dry rendang kept without refrigeration for weeks, carried on journeys across the archipelago. It was packed in bamboo tubes, in wooden boxes, in the woven bamboo rantang, stacked food carriers that still hold the highway meals of West Sumatra. The dish was born of distance."},{id:"philosophy",title:"Rendang and Minang philosophy",body:"In Minang philosophy, the four main ingredients of rendang are symbols. Meat represents ninik mamak, the clan leaders, the oldest and most respected. Coconut milk represents cadiak pandai, the intellectuals, the thinkers who hold knowledge in fluid form. Chilli represents alim ulama, the religious scholars, the heat of faith that gives the dish its urgency. The spices represent the rest of society, the extended kin, the crowd that makes the kitchen work. Cooking rendang is a lesson in patience and consensus. You cannot rush a reduction. You cannot ignore the paste. You cannot add the meat too early. Every stage has its moment. Every ingredient has its role. The cook who listens to the reduction is the cook who understands the clan."},{id:"communal-kitchen",title:"The communal kitchen",body:"Rendang is never cooked alone. It is cooked for weddings, for Eid, for the return of a merantau son. It is cooked in huge woks, kuali or kawah, over wood fire, stirred for hours, often communally. The women of the kampung gather around the hearth, passing the wooden spatula from hand to hand, singing, talking, watching the colour shift from pale gold to amber to dark brown. The reduction takes six to eight hours for a large batch. There is no shortcut. There is no microwave equivalent. The fire is tended. The wok is scraped. The paste is tasted and adjusted. Rendang is a social technology as much as a culinary one. It is the reason the women of the house gather. It is the reason the neighbours bring extra spice. It is the reason the cook is always the oldest woman in the room."},{id:"nasi-padang",title:"Nasi Padang and the rantang",body:"Rendang travels through the Minang restaurant network, the rumah makan Padang found across Indonesia and abroad. The dish is the flagship. A Padang restaurant is recognisable by the glass display case, the curry bowls stacked behind glass, the rice served from a communal basin. The rantang, the stacked food carrier, is the vessel of the diaspora. Minang migrants carried rendang in rantang across the archipelago, from Aceh to Papua, from Jakarta to Singapore, from Medan to Kuala Lumpur. The dish followed the people. The rantang is still used on buses, on trains, on ferries. It is the original takeaway container. Nasi Padang is the most successful ethnic restaurant chain in Southeast Asia. Rendang is its crown jewel."},{id:"world-fame",title:"World fame",body:"Rendang has been repeatedly voted among the world's best foods. It ranked number one in CNN's World's 50 Best Foods reader poll in 2011 and again in 2017. It is an Indonesian national dish, recognised alongside nasi goreng, though purists argue that rendang has more terroir, more specificity, more craft. The global fame brought tourists to Padang restaurants in search of the real thing. Many found kalio instead, the thick stage, because the full reduction is rare outside Minangkabau homes and specialist warung. The world learned the name before it learned the process. The name is famous. The process is not. That is the central misunderstanding of rendang in the global imagination."},{id:"variations",title:"Variations and endings",body:"The driest form is rendang itam, black rendang, cooked until the meat is almost black, the oil fully separated, the spice paste caramelised into a lacquer. This is the form kept for months in the kitchen loft. Chicken rendang, rendang ayam, is lighter, faster, less revered but equally common. Egg rendang, rendang telur, is a street food. Mussel rendang, rendang lokan, is a coastal variation from the fishing towns. Each region adds a fingerprint. Each cook adds a memory. The dish is a living technology, unchanged in its essentials for centuries, but never the same twice."}],_r=[{id:"37066375",name:"Desmond Lim, Chef",caption:"Beef rendang with chilli slices."},{id:"37090687",name:"Fadli Octora Channel",caption:"Traditional beef rendang dish."},{id:"37090686",name:"Fadli Octora Channel",caption:"Indonesian meal with rice and sides."},{id:"37081040",name:"Teguh S",caption:"Rendang beef plate with sides."},{id:"37080534",name:"Wahyu Prabowo",caption:"Beef rendang close up."},{id:"37052499",name:"Raditya Amoret",caption:"Indonesian feast with satay and sambal."},{id:"37081081",name:"Teguh S",caption:"Nasi padang dish close up."},{id:"37205601",name:"Ieda Teddy",caption:"Indonesian dishes on a table."},{id:"37249196",name:"Tiya Nh",caption:"Spicy beef rendang on banana leaf."},{id:"37339493",name:"anggit priyandani",caption:"Nasi padang with beef rendang."},{id:"37057284",name:"Adrian Y Utama",caption:"Beef rendang with red chilli garnish."},{id:"37052607",name:"Raditya Amoret",caption:"Nasi padang dish presentation."},{id:"37066472",name:"3enn",caption:"Nasi padang platter."},{id:"37106616",name:"Tamba Budiarsana",caption:"Rendang in Bali setting."},{id:"3423498",name:"Kun Fotografi",caption:"Cooked food on plate."}],xr={mp4:"https://videos.pexels.com/video-files/37336769/15813962_1080_1920_30fps.mp4",poster:"https://images.pexels.com/videos/37336769/pexels-photo-37336769.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=630&w=1200"},d0=A=>`https://images.pexels.com/photos/${A}/pexels-photo-${A}.jpeg?auto=compress&cs=tinysrgb&fit=crop&w=1600`,r0=[{term:"marandang",gloss:"the act of slow-cooking down"},{term:"gulai",gloss:"liquid curry stage"},{term:"kalio",gloss:"thickened, golden stage"},{term:"rendang",gloss:"fully reduced, dark, dry end state"},{term:"merantau",gloss:"leaving home to seek fortune"},{term:"pemasak",gloss:"the spice paste"},{term:"sarundeng",gloss:"toasted coconut"},{term:"rantang",gloss:"stacked food carriers"},{term:"kuali",gloss:"the cooking wok"},{term:"ninik mamak",gloss:"clan leade .rn-wrap { margin-top: 4rem; }
.rn-rule { height: 1px; background: var(--line); }
.rn-row {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: stretch;
  gap: 1rem;
  padding-top: 1.5rem;
}
.rn-link {
  display: flex;
  flex-direction: column;
  gap: 0.35rem;
  text-decoration: none;
  padding: 0.9rem 1rem;
  border-radius: 10px;
  transition: background 0.25s ease, transform 0.25s ease;
}
.rn-link:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); transform: translateY(-2px); }
.rn-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.rn-next { text-align: right; align-items: flex-end; }
.rn-dir {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted);
}
.rn-name {
  font-size: 15px;
  font-weight: 600;
  color: var(--ink);
}
.rn-name em { font-style: normal; font-weight: 400; color: var(--ink-soft); }
.rn-home {
  align-self: center;
  justify-self: center;
  white-space: nowrap;
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted);
  text-decoration: none;
  border: 1px solid var(--line);
  border-radius: 9999px;
  padding: 0.55rem 1.1rem;
  transition: color 0.25s ease, border-color 0.25s ease;
}
.rn-home:hover { color: var(--accent); border-color: var(--accent); }
.rn-home:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (max-width: 640px) {
  .rn-row { grid-template-columns: 1fr; }
  .rn-next { text-align: left; align-items: flex-start; }
  .rn-home { order: -1; justify-self: start; }
}
@media (prefers-reduced-motion: reduce) {
  .rn-link, .rn-home { transition: none; }
