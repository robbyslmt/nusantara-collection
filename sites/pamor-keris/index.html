,story:"Mataram-era blades, 16th to 18th century, often with beautiful luk and subtle pamor. These are the keris most collectors seek, made during the golden age of Javanese courtcraft."}],yy=[{k:"2005",v:"UNESCO proclaimed the keris a Masterpiece of the Oral and Intangible Heritage of Humanity. Inscription followed in 2008. The keris is recognized not as a weapon but as a living cultural code."},{k:"Prambanan meteorite",v:"The Prambanan meteorite, which fell near the temple complex in the 18th century, is legendary as a source of meteoritic iron for keris blades. The iron is high in nickel, which creates the white lines of pamor after acid washing."},{k:"Warangan",v:"The acid wash uses warangan: a paste of arsenic acid and lime. The iron darkens, the nickel resists. The pattern that appears was always inside the metal, waiting."},{k:"Sura month",v:"The ritual cleansing, jamasan, is often performed during the Javanese month of Sura, the first month of the calendar. A keris is washed, dried, and offered flowers and incense."},{k:"Sumenep",v:"Madura's Sumenep remains a living center of keris production. Empu there forge blades that are still used in weddings, court regalia, and daily life across Java."}],vy=[{name:"Pexels",note:"general"},{name:"Ruyat Supriazi",note:"Pexels photographer"},{name:"Andri Wijayanto",note:"Pexels photographer"},{name:"Noval Gani",note:"Pexels photographer"},{name:"Tuty Farida",note:"Pexels photographer"},{name:"Ricky S",note:"Pexels photographer"}];function gy(){const[A,X]=Pl.useState(()=>typeof window>"u"?"dark":window.localStorage.getItem("pamor-theme")==="light"?"light":"dark");return Pl.useEffect(()=>{document.documentElement.setAttribute("data-theme",A),window.localStorage.setItem("pamor-theme",A)},[A]),{theme:A,toggle:()=>X(E=>E==="dark"?"light":"dark")}}function ol({children:A,delay:X=0}){const E=Pl.useRef(null);return Pl.useEffect(()=>{const h=E.current;if(!h)return;const q=new IntersectionObserver(Z=>{Z.forEach(dl=>{dl.isIntersect
