.rn-wrap { margin-top: 4rem; }
.rn-rule { height: 1px; background: var(--line); }
.rn-row {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: stretch;
  gap: 1rem;
  padding-top: 1.5rem;
}
.rn-link {
  display: flex;
  flex-direction: column;
  gap: 0.35rem;
  text-decoration: none;
  padding: 0.9rem 1rem;
  border-radius: 10px;
  transition: background 0.25s ease, transform 0.25s ease;
}
.rn-link:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); transform: translateY(-2px); }
.rn-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.rn-next { text-align: right; align-items: flex-end; }
.rn-dir {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted);
}
.rn-name {
  font-size: 15px;
  font-weight: 600;
  color: var(--ink);
}
.rn-name em { font-style: normal; font-weight: 400; color: var(--ink-soft); }
.rn-home {
  align-self: center;
  justify-self: center;
  white-space: nowrap;
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted);
  text-decoration: none;
  border: 1px solid var(--line);
  border-radius: 9999px;
  padding: 0.55rem 1.1rem;
  transition: color 0.25s ease, border-color 0.25s ease;
}
.rn-home:hover { color: var(--accent); border-color: var(--accent); }
.rn-home:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (max-width: 640px) {
  .rn-row { grid-template-columns: 1fr; }
  .rn-next { text-align: left; align-items: flex-start; }
  .rn-home { order: -1; justify-self: start; }
}
@media (prefers-reduced-motion: reduce) {
  .rn-link, .rn-home { transition: none; }
  .rn-link:hover { transform: none; }
}

.sr-rail {
  position: fixed;
  right: 18px;
  top: 50%;
  transform: translateY(-50%);
  z-index: 30;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  pointer-events: none;
}
.sr-track {
  position: relative;
  width: 3px;
  height: 180px;
  border-radius: 9999px;
  background: color-mix(in srgb, var(--ink) 14%, transparent);
  overflow: visible;
}
.sr-fill {
  position: absolute;
  inset: 0;
  height: 0%;
  border-radius: inherit;
  background: var(--sr-accent, var(--accent));
  transition: height 0.15s linear;
}
.sr-dot {
  position: absolute;
  left: 50%;
  width: 7px;
  height: 7px;
  border-radius: 9999px;
  background: var(--bg);
  border: 1.5px solid color-mix(in srgb, var(--ink) 35%, transparent);
  transform: translate(-50%, -50%);
  transition: background 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
}
.sr-dot.is-passed {
  background: var(--sr-accent, var(--accent));
  border-color: var(--sr-accent, var(--accent));
}
.sr-dot.is-current {
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--sr-accent, var(--accent)) 22%, transparent);
  border-color: var(--sr-accent, var(--accent));
}
.sr-label {
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  writing-mode: vertical-rl;
  color: var(--muted);
  white-space: nowrap;
}
.sr-label.is-active { color: var(--ink); }
@media (max-width: 900px) { .sr-rail { display: none; } }
@media (prefers-reduced-motion: reduce) {
  .sr-fill, .sr-dot { transition: none; }
}
