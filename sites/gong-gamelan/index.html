.rn-wrap { margin-top: 4rem; }
.rn-rule { height: 1px; background: var(--line); }
.rn-row {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: stretch;
  gap: 1rem;
  padding-top: 1.5rem;
}
.rn-link {
  display: flex;
  flex-direction: column;
  gap: 0.35rem;
  text-decoration: none;
  padding: 0.9rem 1rem;
  border-radius: 10px;
  transition: background 0.25s ease, transform 0.25s ease;
}
.rn-link:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); transform: translateY(-2px); }
.rn-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.rn-next { text-align: right; align-items: flex-end; }
.rn-dir {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted);
}
.rn-name {
  font-size: 15px;
  font-weight: 600;
  color: var(--ink);
}
.rn-name em { font-style: normal; font-weight: 400; color: var(--ink-soft); }
.rn-home {
  align-self: center;
  justify-self: center;
  white-space: nowrap;
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted);
  text-decoration: none;
  border: 1px solid var(--line);
  border-radius: 9999px;
  padding: 0.55rem 1.1rem;
  transition: color 0.25s ease, border-color 0.25s ease;
}
.rn-home:hover { color: var(--accent); border-color: var(--accent); }
.rn-home:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (max-width: 640px) {
  .rn-row { grid-template-columns: 1fr; }
  .rn-next { text-align: left; align-items: flex-start; }
  .rn-home { order: -1; justify-self: start; }
}
@media (prefers-reduced-motion: reduce) {
  .rn-link, .rn-home { transition: none; }
  .rn-link:hover { transform: none; }
}

locking) technique that splits a single melodic line between two players."}),f.jsxs("figure",{className:"my-8",children:[f.jsx("img",{src:Vl[3].url,alt:Vl[3].caption,loading:"lazy",className:"w-full rounded-xl border-line border"}),f.jsxs("figcaption",{className:"mt-2 text-xs text-muted",children:[Vl[3].caption,": ",Vl[3].photographer]})]})]}),f.jsxs(Rt,{id:"set",title:"One Instrument, Many Players",children:[f.jsx("p",{children:"A gamelan is not a pool of interchangeable musicians: it is a single, cohesive instrument built from dozens of individually tuned components. The bronze keys of one saron (metallophone) are filed and hammered until their overtones lock with the resonators. That set is then matched to a gong, a bonang (pot gongs), and a kethuk-kempyang (small敲击 pair) so that the whole orchestra vibrates as one body."}),f.jsxs("p",{children:["Instruments from different gamelan sets are never mixed. If you borrow a kethuk-kempyang from a neighboring pendopo (open pavilion), the whole cycle sounds wrong. Each gamelan carries a formal name, often prefixed with",f.jsx("em",{children:"Kyai"})," (revered), such as Kyai Guntur Madu, the famous kraton gamelan of Yogyakarta, or Kyai Sekati, kept in the Surakarta kraton."]}),f.jsx("p",{children:"The set is owned collectively: by a palace, a village neighborhood, a pesantren (Islamic boarding school), or a radio station. In the 20th century, Radio Republik Indonesia broadcast gamelan from studios across Java, making the form a shared national sound."})]}),f.jsxs(Rt,{id:"tuning",title:"Two Tuning Systems",children:[f.jsx("p",{children:"A full Javanese gamelan carries two complete sets of instruments, one in each tuning. The two are never played together."}),f.jsxs("div",{className:"grid md:grid-cols-2 gap-6 my-8",children:[f.jsxs("div",{className:"bg-base-2 border-line border rounded-xl p-6",children:[f.jsx("h3",{className:"font-display text-2xl text-accent mb-3",children:"Slendro"}),f.jsx("p",{className:"text-sm text-ink-soft mb-4",children:"Five notes per octave, arranged in roughly equal intervals. The older tuning, associated with contemplation, dignity, and the night. Pathet (mode) nem and pathet sanga are slendro modes."}),f.jsx("div",{className:"flex gap-2",children:["ji","ro","lu","pat","mo"].map(U=>f.jsx("span",{className:"font-mono text-xs px-2 py-1 bg-base border-line border rounded",children:U},U))})]}),f.jsxs("div",{className:"bg-base-2 border-line border rounded-xl p-6",children:[f.jsx("h3",{className:"font-display text-2xl text-accent mb-3",children:"Pelog"}),f.jsx("p",{className:"text-sm text-ink-soft mb-4",children:"Seven notes per octave, with uneven intervals. Brighter, more expressive, more angular. Pathet manyura and pathet barang are pelog modes."}),f.jsx("div",{className:"flex gap-2",children:["ji","ro","lu","pat","mo","nem","pi"].map(U=>f.jsx("span",{className:"font-mono text-xs px-2 py-1 bg-base border-line border rounded",children:U},U))})]})]}),f.jsx("p",{children:"The intervals are not equal-tempered. Tuning varies from set to set, even from village to village. A slendro gamelan in Yogyakarta will not exactly match a slendro gamelan in Surabaya. This microtonal flexibility is part of the living tradition."})]}),f.jsxs(Rt,{id:"instruments",title:"The Instruments",children:[f.jsx("p",{children:"A Javanese gamelan is a precision tool. Every part has a name, a function, and a sonic role inside the colotomic (gong-cycle) structure."}),f.jsxs("div",{className:"grid sm:grid-cols-2 gap-6 my-8",children:[f.jsxs("div",{children:[f.jsx("h4",{className:"font-display text-xl text-accent mb-2",children:"Gong Ageng"}),f.jsx("p",{className:"text-sm text-ink-soft",children:"The great gong. The largest, deepest, most revered instrument. One strike marks the end of the largest cycle, the gongan."})]}),f.jsxs("div",{children:[f.jsx("h4",{className:"font-display text-xl text-accent mb-2",children:"Kempul"}),f.jsx("p",{className:"text-sm text-ink-soft",children:"A set of smal ("div",{children:[f.jsx("h4",{className:"font-display text-xl text-accent mb-2",children:"Suling"}),f.jsx("p",{className:"text-sm text-ink-soft",children:"Bamboo transverse flute. The suling adds breath, ornament, and occasional melodic freedom above the fixed-pitch instruments."})]}),f.jsxs("div",{children:[f.jsx("h4",{className:"font-display text-xl text-accent mb-2",children:"Rebab"}),f.jsx("p",{className:"text-sm text-ink-soft",children:"Two-stringed bowed fiddle. The rebab is the only truly pitch-bending instrument in the ensemble; it can lean into intervals between the fixed bronze notes."})]}),f.jsxs("div",{children:[f.jsx("h4",{className:"font-display text-xl text-accent mb-2",children:"Gambang"}),f.jsx("p",{className:"text-sm text-ink-soft",children:"Wooden xylophone. The gambang cuts through the bronze with a dry, woody attack, adding rhythmic and melodic counterpoint."})]}),f.jsxs("div",{children:[f.jsx("h4",{className:"font-display text-xl text-accent mb-2",children:"Siter"}),f.jsx("p",{className:"text-sm text-ink-soft",children:"A plucked zither with 20 to 26 strings. The siter provides rapid figuration, often doubling or shadowing the bonang."})]})]}),f.jsxs("figure",{className:"my-8",children:[f.jsx("img",{src:Vl[6].url,alt:Vl[6].caption,loading:"lazy",className:"w-full rounded-xl border-line border"}),f.jsxs("figcaption",{className:"mt-2 text-xs text-muted",children:[Vl[6].caption,": ",Vl[6].photographer]})]})]}),f.jsxs(Rt,{id:"colotomy",title:"Colotomy: The Gong Cycle",children:[f.jsx("p",{children:"The architecture of gamelan is colotomic: the music is organized around punctuating gongs that mark nested cycles of different lengths. The largest cycle, the gongan, is closed by the gong ageng. Inside the gongan, the kempul and kenong subdivide the time into smaller units. The kethuk-kempyang add still finer ticks."}),f.jsx("p",{children:"A simple colotomic structure might proceed like this: kethuk-kempyang (fast subdivisions), then kenong (mid-cycle), then kempul (sub-gongan), then gong ageng (full cycle close). The cycle then restarts. Because the cycles are nested, the music feels circular, not linear: you are always inside a returning whole."}),f.jsxs("div",{className:"bg-base-2 border-line border rounded-xl p-6 my-8",children:[f.jsxs("div",{className:"flex flex-wrap items-center justify-center gap-4 text-center",children:[f.jsx("div",{className:"w-16 h-16 rounded-full bg-accent/10 border-2 border-accent flex items-center justify-center",children:f.jsx("span",{className:"font-mono text-xs text-accent",children:"kenong"})}),f.jsx("span",{className:"text-muted",children:"→"}),f.jsx("div",{className:"w-20 h-20 rounded-full bg-accent/15 border-2 border-accent flex items-center justify-center",children:f.jsx("span",{className:"font-mono text-xs text-accent",children:"kempul"})}),f.jsx("span",{className:"text-muted",children:"→"}),f.jsx("div",{className:"w-28 h-28 rounded-full bg-accent/20 border-2 border-accent flex items-center justify-center",children:f.jsx("span",{className:"font-display text-sm text-accent",children:"gong ageng"})})]}),f.jsx("p",{className:"text-xs text-muted text-center mt-4",children:"Nested cycles: small, medium, large"})]}),f.jsx("p",{children:"Colotomy is not unique to Java, but Javanese colotomy is uniquely slow and spacious. The Balinese colotomic structure is tighter, faster, and more densely punctuated."})]}),f.jsxs(Rt,{id:"imbal",title:"Interlocking Playing",children:[f.jsxs("p",{children:["In the Javanese tradition, the bonang and gender often play in pairs, each musician handling an interlocking half of a single melodic line. This is the concept of ",f.jsx("em",{children:"imbal"}),": two players trade notes so fast that the ear hears one seamless stream. The division is never fixed by a conductor; it is negotiated in the moment."]}),f.jsx("p",{children:"The kendhang (drum) player is the leader in practice, not by title. A raised hand, a change in stick position, a sudden roll: these are the signals that cue transitions. But every player listens to every other player. If the kendhang speeds up, the saron must speed up without panic. If the suling adds a long ornament, the bonang must leave space."}),f.jsxs("p",{children:["There is no sheet music in the traditional sense. The patterns are learned by ear, by memory, by muscle. A senior musician might cue a new section with a whispered Javanese term: ",f.jsx("em",{children:"lagu"})," (song), ",f.jsx("em",{children:"irama"})," (tempo level),",f.jsx("em",{children:"gongan"})," (the cycle is closing)."]})]}),f.jsxs(Rt,{id:"social",title:"The Social World",children:[f.jsxs("p",{children:["Gamelan lives in the ",f.jsx("em",{children:"pendopo"})," (open pavilion): a rectangular hall with a high, tiered roof, no side walls, and a raised marble or tile floor. The acoustics of the pendopo are part of the instrument. The sound bounces off the wooden pillars and the tiled floor, adding a natural reverb that no hall can replicate."]}),f.jsx("p",{children:"A gamelan is played for wayang (shadow-puppet theatre), for dance, for court ceremonies, for weddings, for funerals, and for national radio broadcasts. Radio Republik Indonesia (RRI) historically broadcast gamelan from studios in Yogyakarta and Surabaya, turning the bronze orchestra into a national medium."}),f.jsxs("p",{children:["In villages, the gamelan is communal property. It belongs to the neighborhood, the ",f.jsx("em",{children:"rukun"})," (mutual assistance group), or the mosque compound. Players sit according to seniority, not celebrity. The youngest musician takes the lowest seat; the oldest, most respected player sits closest to the gong ageng."]}),f.jsxs("figure",{className:"my-8",children:[f.jsx("img",{src:Vl[1].url,alt:Vl[1].caption,loading:"lazy",className:"w-full rounded-xl border-line border"}),f.jsxs("figcaption",{className:"mt-2 text-xs text-muted",children:[Vl[1].caption,": ",Vl[1].photographer]})]})]}),f.jsxs(Rt,{id:"etiquette",title:"
