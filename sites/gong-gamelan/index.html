ap items-center justify-center gap-4 text-center",children:[s.jsx("div",{className:"w-16 h-16 rounded-full bg-accent/10 border-2 border-accent flex items-center justify-center",children:s.jsx("span",{className:"font-mono text-xs text-accent",children:"kenong"})}),s.jsx("span",{className:"text-muted",children:"→"}),s.jsx("div",{className:"w-20 h-20 rounded-full bg-accent/15 border-2 border-accent flex items-center justify-center",children:s.jsx("span",{className:"font-mono text-xs text-accent",children:"kempul"})}),s.jsx("span",{className:"text-muted",children:"→"}),s.jsx("div",{className:"w-28 h-28 rounded-full bg-accent/20 border-2 border-accent flex items-center justify-center",children:s.jsx("span",{className:"font-display text-sm text-accent",children:"gong ageng"})})]}),s.jsx("p",{className:"text-xs text-muted text-center mt-4",children:"Nested cycles: small, medium, large"})]}),s.jsx("p",{children:"Colotomy is not unique to Java, but Javanese colotomy is uniquely slow and spacious. The Balinese colotomic structure is tighter, faster, and more densely punctuated."})]}),s.jsxs(Rt,{id:"imbal",title:"Interlocking Playing",children:[s.jsxs("p",{children:["In the Javanese tradition, the bonang and gender often play in pairs, each musician handling an interlocking half of a single melodic line. This is the concept of ",s.jsx("em",{children:"imbal"}),": two players trade notes so fast that the ear hears one seamless stream. The division is never fixed by a conductor; it is negotiated in the moment."]}),s.jsx("p",{children:"The kendhang (drum) player is the leader in practice, not by title. A raised hand, a change in stick position, a sudden roll: these are the signals that cue transitions. But every player listens to every other player. If the kendhang speeds up, the saron must speed up without panic. If the suling adds a long ornament, the bonang must leave space."}),s.jsxs("p",{children:["There is no sheet music in the traditional sense. The patterns are learned by
